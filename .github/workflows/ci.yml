name: CI

# `next dev` does not typecheck, so a type error runs fine locally and then
# fails every Vercel build, silently freezing production on the last deploy
# that succeeded. Catch it here instead.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned rather than `ubuntu-latest`, which migrates to Ubuntu 26 on
    # 2026-10-19. Naming the image means that migration is a deliberate commit
    # we can watch, not a Monday morning where CI changes underneath us.
    runs-on: ubuntu-26.04
    steps:
      # v7 of both actions runs on node24. v4 targeted node20, which the runners
      # now force onto node24 anyway while warning about it.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The floor we support, not the newest available: `npm test` leans on
          # Node's type stripping, and this proves it still works where it first
          # shipped stable.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Validate learning content
        run: npm run validate:learning
